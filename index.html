<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="THREESYSTEM">
<title>THREESYSTEM</title>
<style>
:root{
  --bg:#000;--fg:#fff;--mut:rgba(255,255,255,.62);--glass:rgba(255,255,255,.05);--glass2:rgba(255,255,255,.13);
  --line:rgba(255,255,255,.17);--hi:rgba(255,255,255,.42);--shadow:rgba(0,0,0,.55);--orb:rgba(255,255,255,.17);
  --btn:#fff;--btnfg:#000;--danger:#ff6b6b;--field:rgba(255,255,255,.08);--g1:.13;--g2:.05;--hi2:rgba(255,255,255,.2);--glow:rgba(255,255,255,.035);--spring:cubic-bezier(.3,1.4,.5,1);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Inter,Segoe UI,Roboto,Arial,sans-serif;
  color-scheme:dark;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{
  --bg:#f1f1f4;--fg:#000;--mut:rgba(0,0,0,.58);--glass:rgba(255,255,255,.5);--glass2:rgba(255,255,255,.85);
  --line:rgba(0,0,0,.09);--hi:rgba(255,255,255,1);--shadow:rgba(0,0,0,.13);--orb:rgba(0,0,0,.1);
  --btn:#000;--btnfg:#fff;--field:rgba(0,0,0,.05);--g1:.85;--g2:.5;--hi2:rgba(255,255,255,.9);--glow:rgba(255,255,255,.25);color-scheme:light;
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:17px;line-height:1.4;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;-webkit-tap-highlight-color:transparent;letter-spacing:-.016em}
body{overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}

.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.orb{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--orb),transparent 68%);filter:blur(10px)}
.o1{width:70vmax;height:70vmax;left:-25vmax;top:-30vmax;animation:d1 26s ease-in-out infinite alternate}
.o2{width:55vmax;height:55vmax;right:-22vmax;top:30vh;animation:d2 32s ease-in-out infinite alternate}
.o3{width:45vmax;height:45vmax;left:10vmax;bottom:-25vmax;animation:d1 38s ease-in-out infinite alternate-reverse}
@keyframes d1{to{transform:translate(8vmax,6vmax) scale(1.12)}}
@keyframes d2{to{transform:translate(-9vmax,-5vmax) scale(.92)}}

.glass{
  background:linear-gradient(135deg,rgba(255,255,255,calc(var(--g1) * var(--ga,1))),rgba(255,255,255,calc(var(--g2) * var(--ga,1))));
  -webkit-backdrop-filter:blur(var(--blur,30px)) saturate(190%) brightness(1.04);backdrop-filter:blur(var(--blur,30px)) saturate(190%) brightness(1.04);
  border:1px solid var(--line);
  box-shadow:inset 1.5px 1.5px 1px -1px var(--hi),inset -1px -1px 1px -1px var(--hi2),inset 0 0 22px var(--glow),0 18px 50px var(--shadow),0 2px 6px rgba(0,0,0,.18);
  border-radius:var(--rad,30px);position:relative;
}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(115deg,rgba(255,255,255,.22) 0%,rgba(255,255,255,0) 32%,rgba(255,255,255,0) 70%,rgba(255,255,255,.08) 100%);mix-blend-mode:soft-light}

.wrap{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:14px 16px 130px}
header.top{position:sticky;top:calc(10px + env(safe-area-inset-top,0px));z-index:20;display:flex;align-items:center;gap:10px;padding:10px 12px 10px 16px;border-radius:999px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.14em;font-size:15px}
.brand svg{flex:none;transition:transform .8s cubic-bezier(.3,1.4,.5,1)}
.brand:hover svg{transform:rotate(120deg)}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 16px;border-radius:999px;background:var(--field);border:1px solid var(--line);font-weight:500;font-size:14px;transition:transform .45s var(--spring),background .25s}
.pill:active{transform:scale(.93)}
.pill:hover{background:var(--glass2)}
.pill.icon{width:42px;padding:0;justify-content:center}
.dnav{display:flex;gap:6px}
.badge{min-width:20px;height:20px;border-radius:10px;background:var(--btn);color:var(--btnfg);font-size:12px;font-weight:700;display:inline-grid;place-items:center;padding:0 6px}
.badge.bump{animation:bump .6s cubic-bezier(.3,1.8,.5,1)}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.7)}100%{transform:scale(1)}}

.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 26px;border-radius:999px;background:var(--btn);color:var(--btnfg);font-weight:600;font-size:17px;transition:transform .5s var(--spring),opacity .2s;box-shadow:0 8px 30px rgba(255,255,255,.12)}
.btn::before{content:"";position:absolute;top:0;left:-70%;width:50%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);transition:left .7s}
.btn:hover::before{left:130%}
.btn:active{transform:scale(.95)}
.btn.ghost{background:var(--field);color:var(--fg);border:1px solid var(--line);box-shadow:none}
.btn.sm{height:38px;padding:0 16px;font-size:14px}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line);box-shadow:none}
.btn[disabled]{opacity:.4;pointer-events:none}
.banner{text-align:center;font-size:13px;color:var(--mut);padding:0 8px 14px}

.hero{padding:38px 24px 30px;overflow:hidden;margin-bottom:22px;--mx:30%;--my:20%}
.hero::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(420px circle at var(--mx) var(--my),rgba(255,255,255,.22),transparent 60%);pointer-events:none}
.sheen{position:absolute;top:0;bottom:0;width:38%;left:-45%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.2),transparent);transform:skewX(-18deg);animation:sheen 8s ease-in-out 1.5s infinite;pointer-events:none}
@keyframes sheen{0%,60%{left:-45%}100%{left:130%}}
.hero h1{font-size:clamp(40px,11.5vw,104px);line-height:.95;letter-spacing:.02em;margin:0 0 14px;font-weight:800;position:relative}
.hero h1 i{font-style:normal;display:inline-block}
.enter .hero h1 i{animation:letter .9s cubic-bezier(.2,1.2,.3,1) backwards;animation-delay:calc(var(--i) * 55ms + 150ms)}
@keyframes letter{from{opacity:0;transform:translateY(.5em) scale(.8);filter:blur(12px)}}
.hero p{max-width:34ch;color:var(--mut);font-size:clamp(16px,2.6vw,20px);line-height:1.4;margin:0 0 24px;position:relative}
.hero .row{display:flex;gap:10px;flex-wrap:wrap;position:relative}
.lens{position:absolute;right:-60px;top:-60px;width:230px;height:230px;border-radius:50%;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.55),rgba(255,255,255,.06) 45%,rgba(255,255,255,.12) 70%);
  border:1px solid var(--line);box-shadow:inset 0 3px 8px rgba(255,255,255,.5),inset 0 -12px 30px rgba(0,0,0,.35),0 30px 60px var(--shadow);
  animation:float 9s ease-in-out infinite alternate;opacity:.85}
.lens.l2{width:90px;height:90px;right:150px;top:auto;bottom:-30px;animation-duration:7s;animation-direction:alternate-reverse;opacity:.6}
@keyframes float{to{transform:translate(-18px,22px) rotate(8deg)}}

.view{display:block}
.enter .view{animation:viewin .65s cubic-bezier(.2,.9,.3,1) backwards}
@keyframes viewin{from{opacity:0;transform:translateY(18px) scale(.985);filter:blur(8px)}}

.tools{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.search{flex:1;min-width:180px;height:46px;border-radius:999px;background:var(--field);border:1px solid var(--line);padding:0 18px;outline:none;transition:box-shadow .3s,border-color .3s}
.search:focus{border-color:var(--fg);box-shadow:0 0 0 5px var(--field)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:38px;padding:0 16px;border-radius:999px;background:var(--field);border:1px solid var(--line);font-size:14px;font-weight:500;transition:transform .25s cubic-bezier(.3,1.5,.5,1),background .25s}
.chip:active{transform:scale(.92)}
.chip.on{background:var(--btn);color:var(--btnfg);border-color:transparent}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.card{padding:12px;display:flex;flex-direction:column;gap:12px;cursor:pointer;transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(var(--ty,0px));transition:transform .55s var(--spring)}
.card.tilting{transition:transform .08s linear}
.card:hover{--ty:-5px}
.card:active{--ty:0px;transform:scale(.97)}
.enter .card{animation:rise .7s cubic-bezier(.2,1.1,.3,1) backwards;animation-delay:calc(var(--i,0) * 70ms + 250ms)}
@keyframes rise{from{opacity:0;transform:translateY(40px) scale(.92);filter:blur(6px)}}
.cover{aspect-ratio:4/3;border-radius:22px;display:grid;place-items:center;font-size:64px;position:relative;overflow:hidden;
  background:radial-gradient(circle at var(--a,30%) var(--b,25%),rgba(255,255,255,.4),rgba(255,255,255,.05) 55%,rgba(0,0,0,.25));
  border:1px solid var(--line);box-shadow:inset 0 1.5px 0 var(--hi)}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .8s cubic-bezier(.2,.9,.3,1)}
.card:hover .cover img{transform:scale(1.07)}
.cover .gl{animation:glf 6s ease-in-out var(--d,0s) infinite alternate}
@keyframes glf{to{transform:translateY(-8px) rotate(6deg)}}
.cover.big{aspect-ratio:1/1;font-size:130px;border-radius:30px}
.thumbs{display:flex;gap:8px;margin-top:10px}
.thumbs button{width:64px;height:64px;border-radius:16px;overflow:hidden;border:2px solid transparent;padding:0;opacity:.6;transition:opacity .2s,transform .25s cubic-bezier(.3,1.5,.5,1)}
.thumbs button.on{border-color:var(--fg);opacity:1}
.thumbs button:active{transform:scale(.9)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.card h3{margin:0 4px;font-size:17px;font-weight:650;letter-spacing:-.02em}
.card .meta{display:flex;justify-content:space-between;align-items:center;margin:0 4px 4px}
.price{font-weight:700;font-size:18px}
.old{text-decoration:line-through;color:var(--mut);font-weight:500;font-size:14px;margin-left:6px}
.mut{color:var(--mut)}
.tag{font-size:12px;color:var(--mut)}
.heart{position:absolute;top:22px;right:22px;z-index:2;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--glass2);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line)}
.heart.on{background:var(--btn);color:var(--btnfg)}
.heart.pop{animation:pop .55s cubic-bezier(.3,1.9,.5,1)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.5)}100%{transform:scale(1)}}
.stars{letter-spacing:2px;font-size:13px}

.panel{padding:22px}
h2{font-size:clamp(30px,6vw,40px);margin:0 0 16px;letter-spacing:-.025em;font-weight:700;line-height:1.08;text-wrap:balance}
h3.s{font-size:20px;margin:0 0 12px;font-weight:600;letter-spacing:-.02em}
.two{display:grid;gap:18px;grid-template-columns:1fr}
@media(min-width:820px){.two{grid-template-columns:1fr 1fr}.two.cart{grid-template-columns:1.4fr 1fr}}
.line{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line .cover{width:64px;aspect-ratio:1;font-size:28px;border-radius:16px;flex:none}
.grow{flex:1;min-width:0}
.qty{display:inline-flex;align-items:center;gap:2px;background:var(--field);border:1px solid var(--line);border-radius:999px}
.qty button{width:34px;height:34px;font-size:18px;border-radius:50%;transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.qty button:active{transform:scale(.7)}
.qty span{min-width:22px;text-align:center;font-weight:600}
.sum{display:flex;justify-content:space-between;padding:7px 0;gap:12px}
.sum.t{font-size:20px;font-weight:750;border-top:1px solid var(--line);margin-top:8px;padding-top:14px}

.f{display:grid;gap:12px}
label.l{display:grid;gap:6px;font-size:13px;color:var(--mut)}
input.i,select.i,textarea.i{width:100%;height:48px;border-radius:16px;background:var(--field);border:1px solid var(--line);padding:0 14px;outline:none;color:var(--fg);transition:border-color .25s,box-shadow .25s}
textarea.i{height:96px;padding:12px 14px;resize:vertical}
textarea.i.tall{height:160px}
input.i:focus,select.i:focus,textarea.i:focus{border-color:var(--fg);box-shadow:0 0 0 4px var(--field)}
select.i option{color:#000}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.4}
.chk input{width:22px;height:22px;flex:none;accent-color:var(--fg)}
.note{font-size:13px;color:var(--mut);line-height:1.4;letter-spacing:-.006em}
.sep{display:flex;align-items:center;gap:12px;color:var(--mut);font-size:13px;margin:6px 0}
.sep::before,.sep::after{content:"";flex:1;height:1px;background:var(--line)}
.err{color:var(--danger);font-size:14px;min-height:18px}
.hidden{display:none!important}
.rate{display:flex;gap:6px}
.rate label{cursor:pointer}
.rate input{position:absolute;opacity:0;pointer-events:none}
.rate span{display:inline-grid;place-items:center;height:38px;min-width:46px;border-radius:999px;background:var(--field);border:1px solid var(--line);font-size:14px;transition:transform .25s cubic-bezier(.3,1.6,.5,1),background .2s}
.rate input:checked+span{background:var(--btn);color:var(--btnfg);transform:scale(1.08)}
.rate input:focus-visible+span{outline:2px solid var(--fg);outline-offset:2px}

details.faq{border-bottom:1px solid var(--line);padding:4px 0}
details.faq:last-child{border-bottom:0}
details.faq summary{list-style:none;cursor:pointer;padding:14px 0;font-weight:600;display:flex;justify-content:space-between;gap:12px;align-items:center}
details.faq summary::-webkit-details-marker{display:none}
details.faq summary::after{content:"+";font-size:22px;font-weight:400;transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
details.faq[open] summary::after{transform:rotate(45deg)}
details.faq p{margin:0 0 14px;color:var(--mut);line-height:1.55;animation:viewin .4s both}

.legal h3{margin:22px 0 6px;font-size:17px}
.legal p,.legal li{color:var(--mut);line-height:1.6;font-size:15px}
footer.ft{margin-top:40px;padding:26px 22px;text-align:center}
footer.ft nav{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:center;margin:14px 0}
footer.ft nav a,footer.ft nav button{font-size:14px;color:var(--mut);transition:color .2s}
footer.ft nav a:hover,footer.ft nav button:hover{color:var(--fg)}

nav.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;gap:4px;padding:7px;border-radius:999px;width:min(480px,calc(100% - 24px))}
nav.tabs a{flex:1;display:grid;justify-items:center;gap:2px;padding:8px 2px;border-radius:999px;font-size:11px;font-weight:600;color:var(--mut);position:relative;z-index:1;transition:color .3s,transform .45s var(--spring)}
nav.tabs a:active{transform:scale(.88)}
nav.tabs a.on{color:var(--fg)}
nav.tabs .badge{position:absolute;top:2px;right:calc(50% - 26px);min-width:18px;height:18px;font-size:11px}
@media(min-width:820px){nav.tabs{display:none}.wrap{padding-bottom:60px}}
@media(max-width:819px){.dnav{display:none}}

.cookie{position:fixed;z-index:40;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 24px));padding:18px 20px;border-radius:28px;animation:cup .7s cubic-bezier(.2,1.1,.3,1) 1s both}
@media(min-width:820px){.cookie{bottom:24px}}
@keyframes cup{from{opacity:0;transform:translate(-50%,40px) scale(.94)}}
.cookie p{margin:0 0 12px;font-size:14px;line-height:1.45;color:var(--mut)}
.cookie .row{display:flex;gap:8px;flex-wrap:wrap}

.seg{display:flex;gap:4px;padding:5px;border-radius:999px;overflow-x:auto;margin-bottom:18px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;height:38px;padding:0 16px;border-radius:999px;font-size:14px;font-weight:600;color:var(--mut);position:relative;z-index:1;transition:color .25s,transform .45s var(--spring)}
.seg button:active{transform:scale(.92)}
.seg button.on{color:var(--btnfg)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px}
@media(min-width:820px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{padding:18px}
.enter .kpi,.kpi.anim{animation:rise .7s cubic-bezier(.2,1.1,.3,1) backwards;animation-delay:calc(var(--i,0) * 80ms)}
.kpi b{display:block;font-size:clamp(22px,4.5vw,32px);letter-spacing:-.03em;margin-top:4px}
.kpi span{font-size:13px;color:var(--mut)}
.tbl{display:grid}
.tr{display:grid;grid-template-columns:1.6fr 1fr 1fr auto;gap:10px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);font-size:14px}
.tr:last-child{border-bottom:0}
.tr.o{grid-template-columns:1.2fr .8fr 1fr auto}
.tr.c{grid-template-columns:1.4fr 1fr 1fr}
@media(max-width:560px){.tr{grid-template-columns:1fr auto}.tr .hide-s{display:none}.tr.o,.tr.c{grid-template-columns:1fr auto}}
.st{display:inline-block;padding:4px 10px;border-radius:999px;border:1px solid var(--line);font-size:12px;background:var(--field)}
.off{opacity:.45}
.bar{height:8px;border-radius:4px;background:var(--field);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--fg);border-radius:4px;transform-origin:left;animation:grow 1s cubic-bezier(.2,1,.3,1) both}
@keyframes grow{from{transform:scaleX(0)}}
.imgs{display:flex;gap:8px;flex-wrap:wrap}
.imgs .im{position:relative;width:72px;height:72px;border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.imgs .im img{width:100%;height:100%;object-fit:cover}
.imgs .im button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.7);color:#fff;font-size:13px;line-height:1}
.imgs .im em{position:absolute;left:4px;bottom:4px;font-size:10px;background:rgba(0,0,0,.7);color:#fff;border-radius:6px;padding:1px 5px;font-style:normal}
.imgs .add{display:grid;place-items:center;width:72px;height:72px;border-radius:16px;border:1px dashed var(--line);font-size:26px;color:var(--mut);cursor:pointer}

.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);display:grid;place-items:end center;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fade .25s}
.sheet{width:min(560px,100%);max-height:92vh;overflow:auto;padding:22px;border-radius:34px 34px 0 0;animation:up .5s cubic-bezier(.2,1.1,.3,1)}
@media(min-width:820px){.sheet-bg{place-items:center}.sheet{border-radius:34px}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(80px) scale(.96);opacity:0}}
.toast{position:fixed;z-index:60;left:50%;top:calc(80px + env(safe-area-inset-top,0px));transform:translateX(-50%);padding:12px 20px;border-radius:999px;font-weight:600;font-size:14px;animation:drop .45s cubic-bezier(.3,1.5,.5,1)}
@keyframes drop{from{transform:translate(-50%,-24px) scale(.88);opacity:0}}
.empty{text-align:center;padding:40px 12px;color:var(--mut)}
.ok-mark{position:relative;width:96px;height:96px;border-radius:50%;margin:0 auto 18px;display:grid;place-items:center}
.ok-mark::before{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--fg);animation:ring 2.2s ease-out infinite}
@keyframes ring{from{transform:scale(.85);opacity:.7}to{transform:scale(1.5);opacity:0}}
.ok-mark path{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .7s .3s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
html{scroll-behavior:smooth}
input[type=range]{width:100%;accent-color:var(--fg);height:28px;background:none;border:0;padding:0}
.ind{position:absolute;border-radius:999px;background:var(--field);box-shadow:inset 0 1px 0 var(--hi),0 4px 14px rgba(0,0,0,.18);z-index:0;pointer-events:none;transform-origin:0 50%}
.seg .ind{background:var(--btn)}
header.top{transition:padding .45s var(--spring),box-shadow .4s}

/* ===== Premium · stile Apple ===== */
:root{--g1:.085;--g2:.03;--line:rgba(255,255,255,.1);--hi:rgba(255,255,255,.22);--hi2:rgba(255,255,255,.08);--glow:rgba(255,255,255,.015);--shadow:rgba(0,0,0,.5);--orb:rgba(255,255,255,.09);--mut:rgba(235,235,245,.6);--ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.3,.5,1)}
:root[data-theme="light"]{--bg:#f5f5f7;--g1:.72;--g2:.55;--line:rgba(0,0,0,.07);--hi:#fff;--hi2:rgba(255,255,255,.9);--shadow:rgba(0,0,0,.08);--orb:rgba(0,0,0,.05);--mut:rgba(60,60,67,.62);--field:rgba(0,0,0,.045)}
html{scroll-behavior:smooth}
::selection{background:rgba(120,160,255,.35)}
body{font-weight:400;letter-spacing:-.011em}
.orb{filter:blur(40px);opacity:.7}
.glass{--rad:28px;border-color:var(--line);box-shadow:inset 0 .5px 0 var(--hi),0 1px 2px rgba(0,0,0,.12),0 20px 50px -18px var(--shadow);-webkit-backdrop-filter:blur(var(--blur,28px)) saturate(170%);backdrop-filter:blur(var(--blur,28px)) saturate(170%)}
.glass::after{display:none}
header.top{padding:8px 10px 8px 18px;margin-bottom:22px;border-radius:999px;transition:box-shadow .4s var(--ease),transform .4s var(--ease)}
.brand{font-weight:600;letter-spacing:.2em;font-size:14px}
.pill{height:40px;font-weight:500;background:transparent;border-color:transparent;transition:background .3s var(--ease),transform .5s var(--spring)}
.pill:hover{background:var(--field)}
.pill.icon{width:40px}
.btn{height:48px;font-weight:500;font-size:16px;letter-spacing:-.01em;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .5s var(--spring),box-shadow .4s var(--ease),opacity .2s}
.btn::before{display:none}
.btn:hover{transform:scale(1.025);box-shadow:0 10px 28px -8px rgba(0,0,0,.45)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--field);box-shadow:none;border-color:var(--line)}
.btn.ghost:hover{box-shadow:none;background:var(--glass2)}
.chip{height:36px;font-weight:500;transition:transform .4s var(--spring),background .3s var(--ease),color .3s}
.chip.on{box-shadow:0 4px 14px -4px rgba(0,0,0,.4)}
.search{height:46px;background:var(--field);border-color:transparent;transition:box-shadow .4s var(--ease),background .3s}
.search:focus{border-color:transparent;box-shadow:0 0 0 4px rgba(10,132,255,.35);background:var(--glass2)}
input.i,select.i,textarea.i{border-radius:14px;border-color:transparent;background:var(--field);transition:box-shadow .3s var(--ease),background .3s}
input.i:focus,select.i:focus,textarea.i:focus{outline:none;box-shadow:0 0 0 4px rgba(10,132,255,.35)}
.sheen,.lens{display:none}
.hero{padding:56px 28px 44px;--rad:34px}
.hero h1{font-weight:700;letter-spacing:-.045em;line-height:.98;background:linear-gradient(180deg,var(--fg) 30%,var(--mut));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero p{font-size:clamp(17px,2.4vw,22px);font-weight:400;letter-spacing:-.02em;max-width:36ch}
h2{font-weight:700;letter-spacing:-.035em;font-size:clamp(28px,4.4vw,40px);line-height:1.08}
h3.s{font-weight:600;letter-spacing:-.02em}
.sechead,.eyebrow{letter-spacing:-.01em}
.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:12px;font-weight:600;color:var(--mut)}
.grid{gap:20px}
.card{padding:10px;--rad:28px;gap:14px;transition:transform .6s var(--ease),box-shadow .5s var(--ease)}
.card:hover{--ty:-6px;box-shadow:inset 0 .5px 0 var(--hi),0 30px 60px -20px var(--shadow)}
.cover{border-radius:20px;overflow:hidden}
.cover img{transition:transform 1.1s var(--ease)}
.card:hover .cover img,.card:hover .cover .gl{transform:scale(1.06)}
.cover .gl{transition:transform 1.1s var(--ease)}
.price{font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.heart{transition:transform .5s var(--spring)}
.panel{padding:22px}
.badge{font-weight:600}
nav.tabs{--rad:999px}
.toast{border-radius:999px;font-weight:500;box-shadow:0 20px 50px -12px rgba(0,0,0,.5)}
.enter .view{animation-duration:.8s;animation-timing-function:var(--ease)}
a,button{transition:opacity .25s var(--ease)}
:focus-visible{outline:2px solid #0a84ff;outline-offset:3px;border-radius:12px}
*{scrollbar-width:thin;scrollbar-color:rgba(128,128,128,.4) transparent}
@keyframes reveal{from{opacity:0;transform:translateY(28px) scale(.985)}to{opacity:1;transform:none}}
@supports (animation-timeline:view()){
  .panel,.tile,.kpi,.featpanel{animation:reveal both var(--ease);animation-timeline:view();animation-range:entry 0% entry 28%}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

/* ===== Donato AI ===== */

.ai-orb{pointer-events:auto;position:fixed;right:18px;bottom:calc(88px + env(safe-area-inset-bottom,0px));width:66px;height:66px;border-radius:50%;display:grid;place-items:center;overflow:hidden;
 background:radial-gradient(circle at 30% 24%,rgba(255,255,255,.6),rgba(255,255,255,.06) 55%),linear-gradient(135deg,rgba(110,170,255,.6),rgba(190,120,255,.5));
 border:1px solid rgba(255,255,255,.4);box-shadow:inset 0 2px 7px rgba(255,255,255,.65),inset 0 -9px 18px rgba(30,20,90,.3),0 16px 40px -6px rgba(90,90,255,.45);
 -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);animation:aifloat 6s ease-in-out infinite;transition:transform .5s var(--spring),opacity .4s,scale .5s var(--spring)}
.ai-orb:hover{transform:scale(1.08)}.ai-orb:active{transform:scale(.93)}
.ai-blob{position:absolute;inset:-25%;background:conic-gradient(from 0deg,transparent,rgba(255,255,255,.55),transparent 70%);animation:aimorph 8s linear infinite;mix-blend-mode:soft-light;filter:blur(3px)}
.ai-orb svg{position:relative;width:46px;height:46px;overflow:visible;filter:drop-shadow(0 0 6px rgba(255,255,255,.6))}
@keyframes aifloat{50%{translate:0 -9px}}
@keyframes aimorph{0%{border-radius:42% 58% 55% 45%/50% 42% 58% 50%;rotate:0deg}50%{border-radius:58% 42% 45% 55%/45% 58% 42% 55%}100%{border-radius:42% 58% 55% 45%/50% 42% 58% 50%;rotate:360deg}}
.ai-veil{position:fixed;inset:0;background:rgba(0,0,0,.18);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);opacity:0;transition:opacity .45s var(--ease)}
.ai-panel{position:fixed;right:10px;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(410px,calc(100vw - 20px));height:min(610px,calc(100dvh - 90px));display:flex;flex-direction:column;overflow:hidden;--rad:34px;--blur:46px;
 opacity:0;transform:translateY(22px) scale(.93);transform-origin:bottom right;transition:opacity .4s var(--ease),transform .6s var(--spring)}

#sysai.open .ai-orb{opacity:0;scale:.4;pointer-events:none}
.ai-hd{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;font-weight:600;letter-spacing:.12em;font-size:14px}
.ai-hd i{width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,#6eaaff,#be78ff);box-shadow:0 0 12px #8aa0ff}
.ai-x{margin-left:auto;width:32px;height:32px;border-radius:50%;background:var(--field);display:grid;place-items:center;font-size:18px;line-height:1}
.ai-log{flex:1;overflow:auto;padding:6px 16px 10px;display:flex;flex-direction:column;gap:9px;overscroll-behavior:contain}
.ai-m{max-width:86%;padding:10px 14px;border-radius:20px;white-space:pre-wrap;word-wrap:break-word;font-size:15px;line-height:1.38;animation:aipop .55s var(--spring)}

function cartAdd(p,q){
  if(!p)return false;
  var op=optOf(p),sz=parseList(p.sizes);
  if(sz.length&&!op.size){toast("Scegli prima la taglia");return false}
  var line={id:p.id,q:q,color:op.color,size:op.size,text:p.custom?op.text.trim():""};
  var k=ckey(line),ex=S.cart.find(function(x){return ckey(x)===k});
  var tot=S.cart.filter(function(x){return x.id===p.id}).reduce(function(a,x){return a+x.q},0)+q;
  if(!p.mto&&tot>p.stock){toast("Disponibili solo "+p.stock+" pezzi");return false}
  if(ex)ex.q+=q;else S.cart.push(line);
  if(!isAdmin())bump("carts");
  ui.bump=true;save();track("add_to_cart",{value:p.price});return true;
}
function cartQty(k,d){
  var c=S.cart.find(function(x){return ckey(x)===k});if(!c)return;
  var p=prod(c.id);
  if(d>0){
    var tot=S.cart.filter(function(x){return x.id===c.id}).reduce(function(a,x){return a+x.q},0);
    if(p&&!p.mto&&tot+1>p.stock){toast("Disponibili solo "+p.stock+" pezzi");return}
    c.q++;
  }else{c.q--;if(c.q<1)S.cart=S.cart.filter(function(x){return ckey(x)!==k})}
  save();draw();
}

function chart(){
  var days=[],i;for(i=6;i>=0;i--){var d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-i);days.push({d:d,v:0})}
  S.orders.forEach(function(o){if(o.status==="Annullato")return;var od=new Date(o.date);od.setHours(0,0,0,0);days.forEach(function(x){if(x.d.getTime()===od.getTime())x.v+=o.total})});
  var max=Math.max.apply(null,days.map(function(x){return x.v}).concat([1]));
  var bars=days.map(function(x,k){var h=Math.max(4,x.v/max*110);return '<rect x="'+(k*52+10)+'" y="'+(130-h)+'" width="32" height="'+h+'" rx="10" fill="currentColor" opacity="'+(x.v?0.9:0.22)+'" style="transform-origin:'+(k*52+26)+'px 130px;animation:grow2 .9s '+(k*70)+'ms cubic-bezier(.2,1,.3,1) both"/><text x="'+(k*52+26)+'" y="150" text-anchor="middle" font-size="11" fill="currentColor" opacity=".6">'+x.d.toLocaleDateString("it-IT",{weekday:"short"})+'</text>'}).join("");
  return '<style>@keyframes grow2{from{transform:scaleY(0)}}</style><svg viewBox="0 0 372 160" width="100%" role="img" aria-label="Ricavi degli ultimi 7 giorni">'+bars+'</svg>';
}

function countUp(){
  var els=document.querySelectorAll("[data-cnt]");
  els.forEach(function(el){
    var to=+el.getAttribute("data-cnt"),fmt=el.getAttribute("data-fmt"),t0=performance.now(),dur=900;
    function fm(x){return fmt==="eur"?eur(x):fmt==="pct"?x.toFixed(1)+"%":Math.round(x)}
    function step(t){var k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);el.textContent=fm(to*e);if(k<1&&document.body.contains(el))requestAnimationFrame(step)}
    requestAnimationFrame(step);
  });
}

function resizeImage(file){
  return new Promise(function(res){
    var fr=new FileReader();
    fr.onload=function(){
      var im=new Image();
      im.onload=function(){
        var m=900,k=Math.min(1,m/Math.max(im.width,im.height)),cv=document.createElement("canvas");
        cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);
        cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);
        res(cv.toDataURL("image/jpeg",0.78));
      };
      im.onerror=function(){res(null)};im.src=fr.result;
    };
    fr.onerror=function(){res(null)};fr.readAsDataURL(file);
  });
}

function runSplash(force){
  var st=S.settings;
  if(!force){
    if(st.splashOn===false)return false;
    try{if(sessionStorage.getItem("ts_splash"))return false}catch(x){}
    if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return false;
  }
  try{sessionStorage.setItem("ts_splash","1")}catch(x){}
  if(document.getElementById("splash"))return false;
  var vw=window.innerWidth,vh=window.innerHeight,hb=document.querySelector("header.top .brand");
  var R=hb?hb.getBoundingClientRect():{left:24,top:24,width:170,height:30,bottom:54};
  var el=document.createElement("div");
  el.id="splash";el.className="splash";el.setAttribute("role","dialog");el.setAttribute("aria-label","Introduzione");
  var letters=st.name.split("").map(function(ch,i){return '<i style="animation-delay:'+(250+i*70)+'ms">'+(ch===" "?"&nbsp;":esc(ch))+'</i>'}).join("");
  el.innerHTML='<div class="sp-glow"></div><div class="sp-lens"></div><div class="sp-brand">'+mark()+'<span class="sp-name">'+letters+'</span></div>'+
    '<div class="sp-type" aria-live="polite"><span class="sp-text"></span><span class="sp-caret"></span></div><div class="sp-skip">Tocca per saltare</div>';
  document.body.appendChild(el);
  var ov=document.documentElement.style.overflow;document.documentElement.style.overflow="hidden";
  if(!force)window.scrollTo({top:0,left:0,behavior:"instant"});
  var brand=el.querySelector(".sp-brand"),typ=el.querySelector(".sp-type"),txt=el.querySelector(".sp-text");
  var k=clamp(Math.min(vw*.88,760)/Math.max(R.width,60),1.3,9);
  brand.style.setProperty("--k",k);
  var b=brand.getBoundingClientRect(),sx=(vw-b.width)/2,sy=vh*.4-b.height/2;
  brand.style.transform="translate("+sx+"px,"+sy+"px)";brand.style.opacity="1";
  var timers=[],done=false;
  function later(fn,ms){var t=setTimeout(fn,ms);timers.push(t);return t}
  function exit(){
    if(done)return;done=true;timers.forEach(clearTimeout);
    document.documentElement.style.overflow=ov;
    lastKey="";draw();
    var a=el.animate([{opacity:1,filter:"blur(0px)",transform:"scale(1)"},{opacity:0,filter:"blur(18px)",transform:"scale(1.06)"}],{duration:850,easing:"cubic-bezier(.4,0,.2,1)",fill:"forwards"});
    a.onfinish=function(){if(el.parentNode)el.parentNode.removeChild(el)};
  }
  el.addEventListener("click",exit);
  function typeText(){
    if(done)return;
    var text=(st.splashText||"").trim();
    typ.style.left=Math.max(20,R.left)+"px";typ.style.top=(R.bottom+36)+"px";typ.style.opacity="1";
    if(!text){later(exit,600);return}
    var i=0,sp=clamp(+st.splashSpeed||42,10,150);
    (function step(){
      if(done)return;
      i++;txt.textContent=text.slice(0,i);
      if(i>=text.length){later(exit,clamp(+st.splashHold||0,0,6000));return}
      var ch=text.charAt(i-1),d=sp*(ch==="\n"?7:/[.,;:!?]/.test(ch)?6:1)*(.75+Math.random()*.5);
      later(step,d);
    })();
  }
  function move(){
    if(done)return;
    var a=brand.animate([{transform:"translate("+sx+"px,"+sy+"px) scale(1)"},{transform:"translate("+R.left+"px,"+R.top+"px) scale("+(1/k)+")"}],{duration:1200,easing:"cubic-bezier(.76,0,.24,1)",fill:"forwards"});
    var ln=el.querySelector(".sp-lens");if(ln)ln.classList.add("out");
    a.onfinish=function(){later(typeText,200)};
  }
  later(move,1500+st.name.length*70+700);
  return true;
}

    var s=S.settings;
    ["name","tagline","banner","heroCta1","heroCta2","shopTitle","company","vat","phone","email","address","pec","sdi","iban","ibanHolder","shipStdDays","shipExpDays","pickupAddr","metaDesc","gaId","metaPixel","faq","mailConfirmS","mailConfirmB","mailShipS","mailShipB","mailInvS","mailInvB"].forEach(function(k){s[k]=(d[k]||"").trim()});
    s.name=s.name||"THREESYSTEM";s.shipStdCost=Math.max(0,+d.shipStdCost||0);s.shipExpCost=Math.max(0,+d.shipExpCost||0);s.freeFrom=Math.max(0,+d.freeFrom||0);s.pickup=!!d.pickup;s.heroAuto=!!d.heroAuto;s.heroMin=Math.max(1,+d.heroMin||3);s.heroMax=Math.max(s.heroMin,+d.heroMax||7);s.payCard=!!d.payCard;s.payPaypal=!!d.payPaypal;s.payBank=!!d.payBank;

    if(pid2){Object.assign(prod(pid2),vals)}else{vals.id="p"+uid();S.products.push(vals)}
    if(save()){ui.modal=null;toast("Prodotto salvato")}else{draw()}
  }
});


/* ---------- Donato AI (assistente) ---------- */
var AI_URL="/api/system-ai",AI={busy:false,hist:[],amp:3,tgt:3};
var AI_HELLO="Ciao, sono Donato AI. Posso cercare prodotti, riempire il carrello, controllare un ordine e guidarti nel negozio. Cosa ti serve?";
var AI_CHIPS=["Consigliami un prodotto","Dov'è il mio ordine?","Spedizioni e resi","Mostrami il carrello"];
function aiCtx(){
  var c=S.settings;
  return {negozio:c.name,faq:c.faq,spedizione:{standard:[c.shipStdCost,c.shipStdDays],express:[c.shipExpCost,c.shipExpDays],gratisSopra:c.freeFrom,ritiro:!!c.pickup},pagamenti:{carta:c.payCard,paypal:c.payPaypal,bonifico:c.payBank},pagina:location.hash||"#/",loggato:!!me(),
    carrello:S.cart.map(function(l){var p=prod(l.id);return {id:l.id,nome:p?p.name:"",q:l.q,colore:l.color,taglia:l.size}}),
    catalogo:S.products.filter(function(p){return p.visible}).slice(0,60).map(function(p){return {id:p.id,nome:p.name,cat:p.cat,prezzo:p.price,scorte:p.mto?"su ordine":p.stock,colori:p.colors,taglie:p.sizes,personalizzabile:!!p.custom,desc:(p.desc||"").slice(0,140)}})};
}
var AIT={
  search_products:function(a){
    var q=String(a.query||"").toLowerCase(),cat=String(a.category||"").toLowerCase();
    return S.products.filter(function(p){return p.visible&&(!cat||String(p.cat).toLowerCase()===cat)&&(!q||(p.name+" "+p.cat+" "+(p.desc||"")).toLowerCase().indexOf(q)>=0)}).slice(0,8).map(function(p){return {id:p.id,nome:p.name,prezzo:p.price,scorte:p.mto?"su ordine":p.stock,colori:p.colors,taglie:p.sizes}});
  },
  open_page:function(a){
    var m={shop:"#/",cart:"#/cart",checkout:"#/checkout",account:"#/account",login:"#/login",contact:"#/contatti",track:"#/traccia",shipping:"#/spedizioni",privacy:"#/privacy",terms:"#/termini",returns:"#/recesso"};
    if(a.product_id){if(!prod(a.product_id))return {error:"prodotto non trovato"};go("#/p/"+a.product_id);return {ok:true}}
    if(!m[a.page])return {error:"pagina sconosciuta"};go(m[a.page]);return {ok:true};
  },
  add_to_cart:function(a){
    var p=prod(a.product_id);if(!p||!p.visible)return {error:"prodotto non trovato"};
    var q=Math.max(1,Math.min(20,parseInt(a.quantity,10)||1)),cols=parseList(p.colors),sz=parseList(p.sizes),color=a.color||cols[0]||"",size=a.size||"";
    if(cols.length&&cols.indexOf(color)<0)return {error:"colori disponibili: "+cols.join(", ")};
    if(sz.length&&sz.indexOf(size)<0)return {error:"serve una taglia tra: "+sz.join(", ")};
    ui.opt[p.id]={color:color,size:size,text:String(a.text||"").slice(0,30)};
    if(!cartAdd(p,q))return {error:"quantità non disponibile"};
    draw();return {ok:true,articoli_nel_carrello:cartCount()};
  },
  remove_from_cart:function(a){S.cart=S.cart.filter(function(l){return l.id!==a.product_id});save();draw();return {ok:true}},
  view_cart:function(){
    var t=totals();
    return {articoli:S.cart.map(function(l){var p=prod(l.id);return {id:l.id,nome:p?p.name:"?",q:l.q,colore:l.color,taglia:l.size,prezzo:p?p.price:0}}),subtotale:t.sub,sconto:t.disc,spedizione:t.ship,totale:t.total,mancano_per_spedizione_gratis:t.left};

  apply_coupon:function(a){

};
function aiTrim(){
  var h=AI.hist.slice(-16);
  while(h.length&&!(h[0].role==="user"&&typeof h[0].content==="string"))h.shift();
  return h;
}
function aiAdd(cls,txt){
  var log=document.querySelector("#sysai .ai-log"),m=document.createElement("div");
  m.className="ai-m "+cls;m.textContent=txt;log.appendChild(m);log.scrollTop=log.scrollHeight;return m;
}
function aiSet(m,txt){m.textContent=txt;m.classList.remove("w");var l=m.parentNode;if(l)l.scrollTop=l.scrollHeight}
async function aiSend(text){
  text=String(text||"").trim().slice(0,600);if(AI.busy||!text)return;
  AI.busy=true;AI.tgt=10;aiAdd("u",text);AI.hist.push({role:"user",content:text});
  var cur=aiAdd("a w","…");
  try{
    for(var turn=0;turn<5;turn++){
      var r=await fetch(AI_URL,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({messages:aiTrim(),ctx:aiCtx()})});
      var d=await r.json();
      if(!r.ok||!d.content)throw new Error(d.error||"errore");
      AI.hist.push({role:"assistant",content:d.content});
      var tus=d.content.filter(function(b){return b.type==="tool_use"}),txt=d.content.filter(function(b){return b.type==="text"}).map(function(b){return b.text}).join("\n").trim();
      if(txt)aiSet(cur,txt);
      if(!tus.length)break;
      var res=[];
      for(var k=0;k<tus.length;k++){
        var out;try{out=AIT[tus[k].name]?await AIT[tus[k].name](tus[k].input||{}):{error:"strumento sconosciuto"}}catch(e){out={error:"non riuscito"}}
        res.push({type:"tool_result",tool_use_id:tus[k].id,content:JSON.stringify(out).slice(0,3000)});
      }
      AI.hist.push({role:"user",content:res});
      if(txt)cur=aiAdd("a w","…");
    }
  }catch(e){aiSet(cur,"Scusami, in questo momento non riesco a rispondere. Riprova tra poco.")}
  if(cur.classList.contains("w")&&cur.textContent==="…"&&cur.parentNode)cur.parentNode.removeChild(cur);
  AI.busy=false;AI.tgt=3;
}
function aiToggle(on){
  var el=document.getElementById("sysai");el.classList.toggle("open",on);
  if(on)setTimeout(function(){el.querySelector(".ai-in input").focus()},350);
}
function aiInit(){
  var el=document.createElement("div");el.id="sysai";
  el.innerHTML='<div class="ai-veil"></div>'+
   '<button class="ai-orb" aria-label="Apri Donato AI"><span class="ai-blob"></span><svg viewBox="0 0 64 64" aria-hidden="true"><g fill="none" stroke="#fff" stroke-linecap="round" stroke-width="2.3"><path class="aw"/><path class="aw" opacity=".7"/><path class="aw" opacity=".45"/></g></svg></button>'+
   '<section class="ai-panel glass" role="dialog" aria-label="Donato AI"><div class="ai-hd"><i></i>Donato AI<button class="ai-x" aria-label="Chiudi">×</button></div><div class="ai-log" aria-live="polite"></div><div class="ai-chips"></div><form class="ai-in"><input type="text" maxlength="600" placeholder="Chiedi qualsiasi cosa…" aria-label="Messaggio"><button aria-label="Invia">↑</button></form></section>';
  document.body.appendChild(el);
  aiAdd("a",AI_HELLO);
  var ch=el.querySelector(".ai-chips");
  AI_CHIPS.forEach(function(t){var b=document.createElement("button");b.type="button";b.textContent=t;b.onclick=function(){aiSend(t)};ch.appendChild(b)});
  el.querySelector(".ai-orb").onclick=function(){aiToggle(true)};
  el.querySelector(".ai-veil").onclick=el.querySelector(".ai-x").onclick=function(){aiToggle(false)};
  el.querySelector(".ai-in").onsubmit=function(e){e.preventDefault();var i=e.target.querySelector("input");var v=i.value;i.value="";aiSend(v)};
  document.addEventListener("keydown",function(e){if(e.key==="Escape")aiToggle(false)});
  function vis(){el.classList.toggle("ai-hide",/^#\/admin/.test(location.hash))}
  window.addEventListener("hashchange",vis);vis();
  var ws=el.querySelectorAll(".aw"),still=window.matchMedia&&window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  function tick(t){
    if(!document.hidden){
      AI.amp+=(AI.tgt-AI.amp)*.06;
      for(var i=0;i<ws.length;i++){
        var d="";
        for(var x=8;x<=56;x+=2){var e=1-Math.pow((x-32)/24,2),y=32+Math.sin(x*.26+t*.0034*(1+i*.45)+i*1.7)*AI.amp*e*(1+i*.15);d+=(x===8?"M":"L")+x+" "+y.toFixed(1)}
        ws[i].setAttribute("d",d);
      }
    }
    if(!still)requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}
loadTrackers();
draw();
runSplash(false);
initSB();
aiInit();
})();
