  const given=off!==null;if(!given)off=1;
  const d=addD(off),key=iso(d),wd=d.getDay(),lab=off==0?'oggi':off==1?'domani':'<b>'+GG[wd]+'</b>',les=S.o[wd]||[],es=ev(key),L=les.length?les.map(x=>esc(x.m)).join(', '):null;

function vSet(){return hd('Opzioni','Rendi l’app tua')+
  `<div class="set glass"><div class="grow"><div class="t1">Il tuo nome</div><input class="nm" placeholder="Es. Carmine" maxlength="20" value="${esc(S.p.n||'')}" oninput="setName(this.value)"></div></div>`+
  `<div class="set glass"><div class="grow"><div class="t1">Colore</div><div class="sw">${Object.keys(TH).map(k=>`<div class="sc"><button class="${S.p.c==k?'on':''}" style="background:${SW[k]}" onclick="S.p.c='${k}';save();applyTheme();render()"></button>${k[0].toUpperCase()+k.slice(1)}</div>`).join('')}</div></div></div>`+
  remSet()+rng('Trasparenza','t',0,100)+rng('Liquid Glass','b',8,60)+
  `<div class="set glass"><div class="grow"><div class="t1">Momo parla ogni tanto</div><div class="t2">Battute e promemoria</div></div><button class="tgl ${S.p.s?'on':''}" onclick="S.p.s=!S.p.s;save();render()"></button></div>`}

/* SHEET */
function sheet(t){
  t=t||({orario:'o',cal:'v'})[tab]||'v';let ty='v';
  const dl=`<datalist id="sj">${subjects().map(s=>`<option value="${esc(s)}">`).join('')}</datalist>`;
  const F={o:`<label>Materia</label><input id="f1" list="sj" placeholder="Es. Matematica">${dl}<label>Ora di inizio</label><div class="dchips">${SL.map(t=>`<button class="${t==freeSlot()?'on':''}" data-t="${t}" onclick="pickSl(this)">${tm0(t)}</button>`).join('')}</div><input id="f2" type="hidden" value="${freeSlot()}">`,
  v:`<div class="seg glass" id="ty" style="margin-top:10px"><button data-t="v" class="on">Verifica</button><button data-t="i">Interrogazione</button></div><label>Materia</label><input id="f1" list="sj" placeholder="Es. Storia">${dl}<label>Argomento</label><input id="f2" placeholder="Es. Rivoluzione francese"><label>Data</label><input id="f3" type="date" value="${left(sel)>=0?sel:iso(addD(7))}">`,
  f:`<label>Ultimo giorno di scuola</label><input id="f1" type="date" value="${S.f||iso(addD(120))}">`}[t];
  const o=document.createElement('div');o.className='ov';
  o.innerHTML=`<div class="sheet glass"><h2>${{o:'Nuova lezione · '+GG[day],v:'Nuovo impegno',f:'Fine della scuola'}[t]}</h2>${F}<button class="save">Salva</button></div>`;
  o.onclick=e=>{if(e.target==o)o.remove()};
  const tb=o.querySelector('#ty');if(tb)tb.onclick=e=>{const b=e.target.closest('button');if(!b)return;ty=b.dataset.t;tb.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x==b))};
  o.querySelector('.save').onclick=()=>{
    const a=o.querySelector('#f1').value.trim(),f2=o.querySelector('#f2'),f3=o.querySelector('#f3'),b=f2?f2.value.trim():'',c=f3?f3.value:'';
    if(!a){o.querySelector('#f1').focus();return}
    if(t=='o'){S.o[day].push({m:a,a:b});S.o[day].sort((x,y)=>x.a.localeCompare(y.a))}
    else if(t=='v'){S.v.push({id:uid(),m:a,n:b,d:c||iso(new Date()),t:ty,f:false,c:iso(new Date())});if(c)sel=c}
    else S.f=a;
    save();o.remove();render()};
  document.body.appendChild(o);setTimeout(()=>o.querySelector('#f1').focus({preventScroll:true}),350);
}

/* RENDER */
function render(){
  $('#top').innerHTML=topHTML();
  $('#app').innerHTML=`<div class="view${fresh?'':' st0'}">${({home:vHome,orario:vOrario,cal:vCal,imp:vSet})[tab]()}</div>`;
  fresh=0;const i=TABS.findIndex(x=>x[0]==tab);
  document.querySelectorAll('#tab button').forEach((b,j)=>b.classList.toggle('on',j==i));
  $('.ind').style.transform=`translateX(${i*100}%)`;setMood(mood);if(popEl)popDraw();
  if(boot){document.querySelectorAll('[data-n]').forEach(el=>{const n=+el.dataset.n;let t0;const f=ts=>{t0=t0||ts;const p=Math.min((ts-t0)/900,1);el.textContent=Math.round(n*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)});
    setTimeout(()=>document.querySelectorAll('[data-o]').forEach(e=>e.style.strokeDashoffset=e.dataset.o),120);boot=0}
}
const SL=['08:20','09:20','10:20','11:20','12:20','13:20'],tm0=a=>(a||'').replace(/^0/,'');
const freeSlot=()=>SL.find(t=>!(S.o[day]||[]).some(x=>x.a==t))||SL[0];
function pickSl(b){$('#f2').value=b.dataset.t;b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x==b))}
function dueRem(){const r=S.p.r,now=new Date(),hm=p2(now.getHours())+':'+p2(now.getMinutes()),a=[];if(!r.on)return a;
  if(hm>=r.vt)up().forEach(x=>{const n=left(x.d);if(r.d.includes(n))a.push({k:x.id+'|'+iso(now),h:`${n==0?'Oggi':n==1?'Domani':'Tra '+n+' giorni'} hai ${x.t=='v'?'la verifica':'l’interrogazione'} di <b>${esc(x.m)}</b> ${x.t=='v'?'📝':'🎤'}`})});
  if(r.m&&hm>=r.mt){const L=S.o[addD(1).getDay()]||[];if(L.length)a.push({k:'m|'+iso(now),h:`Domani hai: <b>${L.map(x=>esc(x.m)).join(', ')}</b> 🎒`})}
  return a.filter(x=>!S.p.rd[x.k])}
const remHTML=()=>{const d=dueRem();return d.length?`<div>${d.map(x=>`<div class="rm glass"><span class="bell">🔔</span><div class="grow">${x.h}</div><button class="x" onclick="dis('${x.k}')">×</button></div>`).join('')}</div>`:''};
function dis(k){S.p.rd[k]=1;save();render()}
function togD(n){const r=S.p.r;r.d=r.d.includes(n)?r.d.filter(x=>x!=n):[...r.d,n].sort((a,b)=>a-b);save();render()}
async function askPerm(){try{await Notification.requestPermission()}catch(e){}render()}
const ntf=()=>!('Notification' in window)?'Non disponibili qui':Notification.permission=='granted'?'Attive ✓':Notification.permission=='denied'?'Bloccate dal telefono':'Tocca per attivare';
function remSet(){const r=S.p.r;return `<div class="set glass"><div class="grow"><div class="t1">Notifiche e promemoria</div><div class="t2">Compaiono in Home all’ora scelta</div></div><button class="tgl ${r.on?'on':''}" onclick="S.p.r.on=!S.p.r.on;save();render()"></button></div>`+(r.on?`<div class="set glass"><div class="grow"><div class="t1">Verifiche e interrogazioni</div><div class="t2">Avvisami prima (puoi sceglierne più di uno)</div><div class="dchips">${[0,1,2,3,5,7].map(n=>`<button class="${r.d.includes(n)?'on':''}" onclick="togD(${n})">${n==0?'Il giorno stesso':n+(n==1?' giorno':' giorni')}</button>`).join('')}</div><div class="trow">Alle <input class="tin" type="time" value="${r.vt}" onchange="S.p.r.vt=this.value;save();render()"></div></div></div>
  <div class="set glass"><div class="grow"><div class="t1">Materie di domani</div><div class="trow">${r.m?`Ricordamele alle <input class="tin" type="time" value="${r.mt}" onchange="S.p.r.mt=this.value;save();render()">`:'<span class="t2">Spento</span>'}</div></div><button class="tgl ${r.m?'on':''}" onclick="S.p.r.m=!S.p.r.m;save();render()"></button></div>
  <div class="set glass" onclick="askPerm()" style="cursor:pointer"><div class="grow"><div class="t1">Notifiche del telefono</div><div class="t2">${ntf()} · arrivano quando l’app è aperta</div></div></div>`:'')}
const shown={};
function remTick(){const d=dueRem().filter(x=>!shown[x.k]);if(!d.length)return;d.forEach(x=>{shown[x.k]=1;try{if('Notification' in window&&Notification.permission=='granted')new Notification('Momo 🔔',{body:x.h.replace(/<[^>]+>/g,'')})}catch(e){}});if(!document.querySelector('.ov')&&document.activeElement.tagName!='INPUT')render()}
$('#tab').innerHTML='<i class="ind"></i>'+TABS.map(t=>`<button onclick="go('${t[0]}')"><svg viewBox="0 0 24 24">${t[2]}</svg>${t[1]}</button>`).join('');
let tx=0;addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx;if(tab=='cal'&&Math.abs(dx)>80&&!document.querySelector('.ov'))mv(dx<0?1:-1)},{passive:true});
setInterval(()=>{if(S.p.s&&tab=='home'&&!document.querySelector('.ov')&&document.activeElement.tagName!='INPUT')randSay()},22000);
applyTheme();Object.keys(S.p.rd).forEach(k=>{if(k.split('|')[1]<iso(new Date()))delete S.p.rd[k]});render();remTick();setInterval(remTick,30000);
</script>
</body>
</html>
